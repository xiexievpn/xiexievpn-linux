name: Build Linux Client

on:
  push:
    branches: [master]
    paths:
      - 'main_linux.py'
      - 'languages.json'
      - 'build_linux.sh'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      xray_version:
        description: 'Xray Core version (e.g., v25.3.6)'
        required: false
        default: 'v25.3.6'

env:
  XRAY_VERSION: ${{ github.event.inputs.xray_version || 'v25.3.6' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-pil python3-pil.imagetk unzip wget

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller requests pillow

      - name: Prepare build directory
        run: |
          mkdir -p build_work
          cp main_linux.py build_work/
          cp languages.json build_work/
          cp favicon.ico build_work/

      - name: Download Xray Core
        run: |
          wget -O xray.zip "https://github.com/XTLS/Xray-core/releases/download/${{ env.XRAY_VERSION }}/Xray-linux-64.zip"
          unzip -o xray.zip xray geoip.dat geosite.dat -d build_work/
          chmod +x build_work/xray

      - name: Build with PyInstaller
        run: |
          cd build_work
          pyinstaller --onefile --windowed --clean \
            --name "xiexievpn_linux" \
            --add-data "languages.json:." \
            --add-data "favicon.ico:." \
            --add-data "xray:." \
            --add-data "geoip.dat:." \
            --add-data "geosite.dat:." \
            --hidden-import PIL._tkinter_finder \
            main_linux.py

      - name: Get version from commit
        id: version
        run: |
          VERSION=$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiexievpn-linux-${{ steps.version.outputs.version }}
          path: build_work/dist/xiexievpn_linux
          retention-days: 30

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: build_work/dist/xiexievpn_linux
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
